<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Hub NET</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="apple-touch-icon" href="bilder/nutrition_image_11.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 class="header-title">Nutrition Hub</h1>
    <select id="languageSelect" class="language-selector" onchange="changeLanguage(this.value)">
        <option value="data_sv.json">Svenska</option>
        <option value="data_en.json">English</option>
    </select>
</header>

<div class="main-container" id="appContent">
    <p style="text-align: center; color: #a0aec0; margin-top: 40px;">Loading content...</p>
</div>

<nav class="bottom-navigation">
    <div id="nav-home" class="nav-item active" onclick="renderSection('home')">
        <span class="nav-icon">🏠</span><span id="label-home">Hem</span>
    </div>
    <div id="nav-recipes" class="nav-item" onclick="renderSection('recipes')">
        <span class="nav-icon">🍳</span><span id="label-recipes">Recept</span>
    </div>
    <div id="nav-favorites" class="nav-item" onclick="renderSection('favorites')">
        <span class="nav-icon">❤️</span><span id="label-favorites">Favoriter</span>
    </div>
    <div id="nav-advice" class="nav-item" onclick="renderSection('advice')">
        <span class="nav-icon">💡</span><span id="label-advice">Råd</span>
    </div>
    <div id="nav-know" class="nav-item" onclick="renderSection('know')">
        <span class="nav-icon">📚</span><span id="label-know">Kunskap</span>
    </div>
</nav>

<script src="script.js"></script>

</body>
</html>
